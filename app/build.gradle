
plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.dailybalance'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.dailybalance'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '1.7'
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:35.2.0')

    // Firebase Authentication
    implementation 'com.google.firebase:firebase-auth'

    // Cloud Firestore
    implementation 'com.google.firebase:firebase-firestore'\n\n    // Google account sign-in\n    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
